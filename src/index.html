<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>展票番茄钟</title>
    <!-- 阶段1：CSS变量主题系统（技术文档§3.1） -->
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== 专注主题（默认）===== */
        :root {
            --bg-primary: #39FF14;    /* 荧光绿 */
            --bg-secondary: #8B5CF6;   /* 亮紫 */
            --bg-tertiary: #FF6B35;    /* 亮橙 */
            --ticket-bg: #FFFFFF;
            --ink: #000000;
        }

        /* ===== 休息主题 ===== */
        body[data-phase="break"] {
            --bg-primary: #FF2D95;    /* 热粉 */
            --bg-secondary: #FFE600;   /* 亮黄 */
            --bg-tertiary: #00E5FF;    /* 亮青 */
        }

        /* ===== 页面基础布局 ===== */
        body {
            min-height: 100dvh;
            /* 多巴胺多色拼接背景（PRD §5.1 / 技术文档§3.1） */
            background: linear-gradient(
                135deg,
                var(--bg-primary) 0%,
                var(--bg-primary) 40%,
                var(--bg-secondary) 40%,
                var(--bg-secondary) 70%,
                var(--bg-tertiary) 70%,
                var(--bg-tertiary) 100%
            );
            font-family: system-ui, -apple-system, "Arial Black", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.3s;
        }

        /* ===== 门票主体（技术文档§3.2 / PRD §5.2）===== */
        .ticket {
            background: var(--ticket-bg);
            border: 4px solid var(--ink);
            border-radius: 16px;
            box-shadow: 8px 8px 0 var(--ink);
            width: 100%;
            max-width: 420px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
        }

        /* 票头 */
        .ticket__header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .ticket__phase {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--ink);
        }
        .ticket__subtitle {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--ink);
            opacity: 0.5;
        }

        /* 超大倒计时数字（F-11 / PRD §5.3） */
        .ticket__countdown {
            font-size: clamp(64px, 22vw, 116px);
            font-weight: 900;
            line-height: 1;
            color: var(--bg-secondary);
            -webkit-text-stroke: 4px var(--ink);
            font-family: "Arial Black", system-ui, sans-serif;
            padding: 16px 0;
            text-align: center;
        }

        /* 撕票虚线（F-13） */
        .ticket__divider {
            width: 100%;
            border-top: 2px dashed var(--ink);
            position: relative;
        }
        .ticket__divider::before,
        .ticket__divider::after {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            background: var(--bg-primary);
            border: 4px solid var(--ink);
            border-radius: 50%;
        }
        .ticket__divider::before { left: -32px; }
        .ticket__divider::after { right: -32px; }

        /* 控制按钮 */
        .ticket__controls {
            width: 100%;
            display: flex;
            gap: 12px;
            padding-top: 8px;
        }
        .btn {
            flex: 1;
            padding: 14px 0;
            font-size: 18px;
            font-weight: 900;
            border: 3px solid var(--ink);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: inherit;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: none !important;
        }
        .btn--primary {
            background: var(--ink);
            color: var(--ticket-bg);
            box-shadow: 4px 4px 0 var(--bg-secondary);
        }
        .btn--ghost {
            background: transparent;
            color: var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
        }

        /* ===== 全屏闪烁动画（F-07 / 技术文档§3.4.1）===== */
        @keyframes flash {
            0%, 100% { background-color: var(--bg-primary); }
            25% { background-color: #FFFFFF; }
            50% { background-color: var(--ink); }
            75% { background-color: #FFFFFF; }
        }
        body.flashing {
            animation: flash 0.4s ease-in-out 5;
        }

        /* 减少动画偏好：降级为单次淡入淡出（NF-09） */
        @media (prefers-reduced-motion: reduce) {
            body.flashing {
                animation: flash 0.6s ease-in-out 1;
            }
            * {
                transition-duration: 0.01ms !important;
            }
        }

        /* 今日已完成计数器（F-16） */
        .ticket__counter {
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--ink);
            opacity: 0.6;
            letter-spacing: 1px;
        }
    </style>
</head>
<body data-phase="focus">
    <!-- 阶段2：门票DOM结构（PRD §5.2 / 架构设计§3.2） -->
    <main class="ticket">
        <header class="ticket__header">
            <span class="ticket__phase" id="phaseLabel">FOCUS</span>
            <span class="ticket__subtitle">EXHIBITION PASS</span>
        </header>

        <div class="ticket__countdown" id="countdown" aria-live="polite">25:00</div>

        <div class="ticket__divider"></div>

        <div class="ticket__counter" id="counter">今日已完成 0 段</div>

        <footer class="ticket__controls">
            <button id="startBtn" class="btn btn--primary" aria-label="开始或暂停计时">开始</button>
            <button id="resetBtn" class="btn btn--ghost" aria-label="重置计时">重置</button>
        </footer>
    </main>

    <!-- 阶段3：计时引擎（技术文档§3.3 / 架构设计§3.2 JS模块） -->
    <script>
        // ===== 配置常量 =====
        const FOCUS_DURATION = 25 * 60;
        const BREAK_DURATION = 5 * 60;

        // ===== 状态管理 =====
        let phase = 'focus';       // 'focus' | 'break'
        let remaining = FOCUS_DURATION;
        let isRunning = false;
        let timerId = null;
        let completedCount = 0;    // 今日已完成段数（F-16）

        // ===== DOM 引用 =====
        const countdownEl = document.getElementById('countdown');
        const phaseLabelEl = document.getElementById('phaseLabel');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const counterEl = document.getElementById('counter');

        // ===== 时间格式化：MM:SS =====
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // ===== 渲染倒计时 =====
        function renderCountdown() {
            countdownEl.textContent = formatTime(remaining);
        }

        // ===== 渲染已完成段数（F-16）=====
        function renderCounter() {
            counterEl.textContent = `今日已完成 ${completedCount} 段`;
        }

        // ===== 渲染阶段（主题 + 标签）=====
        function renderPhase() {
            document.body.setAttribute('data-phase', phase);
            phaseLabelEl.textContent = phase === 'focus' ? 'FOCUS' : 'BREAK';
        }

        // ===== 到点切换阶段（F-03）=====
        function switchPhase() {
            completedCount++;          // 每完成一个阶段 +1（F-16）
            renderCounter();
            phase = phase === 'focus' ? 'break' : 'focus';
            remaining = phase === 'focus' ? FOCUS_DURATION : BREAK_DURATION;
            renderPhase();
            renderCountdown();
            // 触发提醒（阶段4/5实现）
            triggerFlash();
            playBeep();
        }

        // ===== 每秒滴答 =====
        function tick() {
            remaining--;
            renderCountdown();
            if (remaining <= 0) {
                pauseTimer();
                switchPhase();
                startTimer();
            }
        }

        // ===== 启动计时 =====
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            startBtn.textContent = '暂停';
            timerId = setInterval(tick, 1000);
        }

        // ===== 暂停计时 =====
        function pauseTimer() {
            isRunning = false;
            startBtn.textContent = '继续';
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
        }

        // ===== 重置计时（F-06）=====
        function resetTimer() {
            initAudio();               // NF-10：任意按钮首次点击均初始化音频
            pauseTimer();
            phase = 'focus';
            remaining = FOCUS_DURATION;
            startBtn.textContent = '开始';
            renderPhase();
            renderCountdown();
        }

        // ===== 开始/暂停 切换（F-04 / F-05）=====
        function toggleStart() {
            // 初始化音频（阶段5，用户交互时调用）
            initAudio();
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // ===== 阶段4：全屏闪烁（F-07 / 技术文档§3.4.1）=====
        function triggerFlash() {
            document.body.classList.remove('flashing');
            // 强制重排以重启动画
            void document.body.offsetWidth;
            document.body.classList.add('flashing');
            // 动画结束后移除（0.4s × 5次 = 2s）
            setTimeout(() => {
                document.body.classList.remove('flashing');
            }, 2000);
        }

        // ===== 阶段5：蜂鸣提示音（F-08 / 技术文档§3.4.2）=====
        let audioCtx = null;

        // ⚠️ 必须在用户首次交互（点击开始）时调用，否则被自动播放策略拦截
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep() {
            if (!audioCtx) return;
            // 连续响 3 次，每次 0.3s，间隔 0.2s
            for (let i = 0; i < 3; i++) {
                const startTime = audioCtx.currentTime + i * 0.5;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';       // 方波，穿透力强（F-09）
                osc.frequency.value = 880;  // A5 音高
                gain.gain.setValueAtTime(0.3, startTime);
                // 平滑归零消除爆音（技术文档§3.4.2）
                gain.gain.linearRampToValueAtTime(0, startTime + 0.28);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + 0.3);
            }
        }

        // ===== 事件绑定（PRD §4 交互）=====
        startBtn.addEventListener('click', toggleStart);
        startBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleStart();
        });
        resetBtn.addEventListener('click', resetTimer);
        resetBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            resetTimer();
        });

        // ===== 初始渲染 =====
        renderPhase();
        renderCountdown();
        renderCounter();
    </script>
</body>
</html>
